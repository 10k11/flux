name: Desktop app
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      # GitHub's download servers sometimes answer 503/504; retry instead of failing the release.
      - name: Install dependencies
        shell: bash
        working-directory: desktop
        run: |
          for i in 1 2 3 4 5; do npm ci && exit 0; echo "npm ci failed (attempt $i), retrying..."; sleep $((i * 30)); done; exit 1
      - name: Build installer
        shell: bash
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          for i in 1 2 3 4 5; do npm run dist && exit 0; echo "build failed (attempt $i), retrying..."; sleep $((i * 30)); done; exit 1
      - uses: actions/upload-artifact@v7
        with:
          name: flux-desktop-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" desktop/dist/*.exe desktop/dist/*.dmg desktop/dist/*.AppImage --clobber 2>/dev/null || gh release upload "${{ github.ref_name }}" $(ls desktop/dist/*.exe desktop/dist/*.dmg desktop/dist/*.AppImage 2>/dev/null) --clobber
